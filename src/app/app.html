<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:bg-white focus:p-2">
  Ugrás a tartalomhoz
</a>

<header class="border-b-4 border-ink bg-paper">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
    <a routerLink="/" class="flex items-center gap-3" aria-label="Kisújszállási Vigadó – kezdőlap">
      <app-logo [size]="44" />
      <span class="leading-tight">
        <span class="block font-display text-xl font-semibold">Kisújszállási Vigadó</span>
        <span class="block text-sm text-ink-soft">Jegyfoglalás és -vásárlás</span>
      </span>
    </a>
    <nav aria-label="Főmenü">
      <a
        routerLink="/"
        routerLinkActive="border-brick text-brick"
        [routerLinkActiveOptions]="{ exact: true }"
        class="border-b-4 border-transparent px-1 py-2 font-semibold hover:border-ink"
      >
        Műsor
      </a>
    </nav>
  </div>
</header>

<main id="main" class="mx-auto max-w-6xl px-4 py-8">
  <router-outlet />
</main>

<footer class="mt-12 border-t border-line bg-paper-deep">
  <div class="mx-auto max-w-6xl px-4 py-6 text-sm text-ink-soft">
    © {{ year }} Kisújszállási Vigadó · A bankkártyás fizetést külső fizetési szolgáltató végzi, kártyaadatot nem tárolunk.
  </div>
</footer>
